<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Colina — Full-Stack Developer</title>
  <desc id="desc">Animated retro Java terminal with a pixel coffee cup, JVM boot messages and phosphor display effects.</desc>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
    <filter id="amberGlow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="typing"><rect class="type-mask" x="0" y="128" width="520" height="28"/></clipPath>
    <style>
      text{font-family:'Courier New',Consolas,monospace}.cursor{animation:blink .8s steps(1) infinite}.steam-a{animation:steam 2.8s ease-in-out infinite}.steam-b{animation:steam 2.8s .7s ease-in-out infinite}.steam-c{animation:steam 2.8s 1.4s ease-in-out infinite}.type-mask{animation:type 6s steps(27) infinite}.scanline{animation:scan 5s linear infinite}.load{stroke-dasharray:430;animation:load 4.5s ease-in-out infinite}.led{animation:pulse 1.5s ease-in-out infinite}.frame{animation:frame 3s ease-in-out infinite}.pixel{shape-rendering:crispEdges}
      @keyframes blink{50%{opacity:0}}@keyframes steam{0%{opacity:0;transform:translateY(12px)}35%{opacity:.9}100%{opacity:0;transform:translateY(-28px)}}@keyframes type{0%,8%{width:0}50%,82%{width:520px}92%,100%{width:0}}@keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(390px)}}@keyframes load{0%{stroke-dashoffset:430}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-430}}@keyframes pulse{50%{opacity:.28}}@keyframes frame{50%{stroke-opacity:.45}}
      @media(prefers-reduced-motion:reduce){.cursor,.steam-a,.steam-b,.steam-c,.type-mask,.scanline,.load,.led,.frame{animation:none}.type-mask{width:520px}.load{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#0b0908"/><rect x="18" y="18" width="1164" height="324" rx="10" fill="#17120f" stroke="#6f4e37" stroke-width="2"/><rect x="39" y="42" width="1122" height="276" rx="5" fill="#100d0b" stroke="#3e2723"/>
  <g fill="#f89820" font-size="14"><text x="62" y="70">GUSTAVO_OS [ JVM 21 ]</text><text x="1138" y="70" text-anchor="end">MEM 100% // READY</text></g><circle class="led" cx="1091" cy="94" r="5" fill="#7cb342" filter="url(#greenGlow)"/><text x="1138" y="99" text-anchor="end" fill="#7cb342" font-size="13">ONLINE</text>
  <g class="pixel" transform="translate(108 105)"><path d="M16 78h132v66H32q-16 0-16-16zm132 14h23q27 0 27 24t-27 24h-23v-16h22q11 0 11-8t-11-8h-22z" fill="#f3e5c8"/><path d="M31 91h101v37H31z" fill="#6f4e37"/><path class="steam-a" d="M52 66c-22-20 18-25 0-47" fill="none" stroke="#f89820" stroke-width="8"/><path class="steam-b" d="M87 65c-22-20 18-25 0-47" fill="none" stroke="#5382a1" stroke-width="8"/><path class="steam-c" d="M122 66c-22-20 18-25 0-47" fill="none" stroke="#f89820" stroke-width="8"/><rect x="5" y="151" width="190" height="9" fill="#8d6e63"/><rect x="31" y="160" width="138" height="7" fill="#3e2723"/></g>
  <g transform="translate(370 103)"><text x="0" y="0" fill="#7cb342" font-size="15">$ java Developer.java</text><text x="0" y="65" fill="#f3e5c8" font-size="52" font-weight="700" letter-spacing="2" filter="url(#amberGlow)">GUSTAVO COLINA</text><text x="2" y="105" fill="#f89820" font-size="21" letter-spacing="4">FULL-STACK DEVELOPER</text><g clip-path="url(#typing)"><text x="35" y="145" fill="#7cb342" font-size="16">BUILD ONCE // SHIP EVERYWHERE</text></g><rect class="cursor" x="553" y="128" width="11" height="20" fill="#7cb342" filter="url(#greenGlow)"/><path class="load" d="M2 178H432" stroke="#5382a1" stroke-width="4"/><text x="2" y="205" fill="#9f8b76" font-size="13">SPRING_BOOT :: TYPESCRIPT :: FLUTTER :: CLOUD</text></g>
  <text x="62" y="302" fill="#9f8b76" font-size="12">CLASS LOADED: reliable.systems.Engineer</text><text x="1138" y="302" text-anchor="end" fill="#9f8b76" font-size="12">ARAGUA, VE // REMOTE</text><rect class="scanline" x="39" y="30" width="1122" height="24" fill="#f89820" opacity=".05"/><rect x="39" y="42" width="1122" height="276" rx="5" fill="url(#scan)"/><rect class="frame" x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#f89820" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Colina — Full-Stack Developer</title>
  <desc id="desc">Animated retro-futuristic header with a neon grid, scanlines and terminal cursor.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070216"/>
      <stop offset=".5" stop-color="#13072b"/>
      <stop offset="1" stop-color="#001b2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset=".48" stop-color="#9d4edd"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#ffe66d"/>
      <stop offset=".45" stop-color="#ff4ecd"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
    </pattern>
    <pattern id="grid" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-width="1" opacity=".32"/>
    </pattern>
    <filter id="pinkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="horizon"><rect x="0" y="240" width="1200" height="120"/></clipPath>
    <style>
      .grid { animation: gridShift 4s linear infinite; }
      .scanline { animation: scanMove 5s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .cursor { animation: blink .8s steps(1) infinite; }
      .dash { stroke-dasharray: 8 12; animation: dataFlow 1.2s linear infinite; }
      .dot-a { animation: dot 1.8s ease-in-out infinite; }
      .dot-b { animation: dot 1.8s .3s ease-in-out infinite; }
      .dot-c { animation: dot 1.8s .6s ease-in-out infinite; }
      @keyframes gridShift { to { transform: translateY(40px); } }
      @keyframes scanMove { from { transform: translateY(-30px); } to { transform: translateY(390px); } }
      @keyframes pulse { 50% { opacity: .72; filter: url(#pinkGlow); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes dataFlow { to { stroke-dashoffset: -20; } }
      @keyframes dot { 50% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) {
        .grid, .scanline, .pulse, .cursor, .dash, .dot-a, .dot-b, .dot-c { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#sky)"/>
  <circle cx="600" cy="245" r="150" fill="url(#sun)" opacity=".72"/>
  <g clip-path="url(#horizon)" class="grid">
    <rect x="-120" y="200" width="1440" height="220" fill="url(#grid)" transform="skewX(-22)"/>
  </g>
  <path d="M0 245H1200" stroke="#ff2bd6" stroke-width="2" opacity=".8" filter="url(#pinkGlow)"/>
  <path class="dash" d="M85 75H315M885 75h230" stroke="#00e5ff" stroke-width="2" opacity=".72"/>

  <g font-family="'Courier New', Consolas, monospace" text-anchor="middle">
    <text x="600" y="70" fill="#00e5ff" font-size="16" letter-spacing="5">SYSTEM PROFILE // ONLINE</text>
    <text class="pulse" x="600" y="153" fill="url(#neon)" font-size="66" font-weight="700" letter-spacing="3" filter="url(#pinkGlow)">GUSTAVO COLINA</text>
    <text x="600" y="198" fill="#f4eaff" font-size="22" letter-spacing="4">FULL-STACK DEVELOPER</text>
    <text x="585" y="227" fill="#00e5ff" font-size="15" letter-spacing="2">WEB // DESKTOP // MOBILE</text>
    <rect class="cursor" x="786" y="211" width="11" height="19" fill="#00e5ff" filter="url(#cyanGlow)"/>
  </g>

  <g transform="translate(92 315)">
    <circle class="dot-a" cx="0" cy="0" r="5" fill="#ff2bd6"/>
    <circle class="dot-b" cx="20" cy="0" r="5" fill="#9d4edd"/>
    <circle class="dot-c" cx="40" cy="0" r="5" fill="#00e5ff"/>
    <text x="58" y="5" fill="#b9a8d4" font-size="13" font-family="'Courier New', Consolas, monospace">BUILDING RELIABLE SYSTEMS SINCE 2024</text>
  </g>
  <text x="1108" y="320" text-anchor="end" fill="#b9a8d4" font-size="13" font-family="'Courier New', Consolas, monospace">ARAGUA // VE</text>

  <rect class="scanline" x="0" y="-20" width="1200" height="26" fill="#00e5ff" opacity=".055"/>
  <rect width="1200" height="360" rx="24" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".75"/>
</svg>
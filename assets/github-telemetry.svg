<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Live GitHub telemetry for Suggus1899</title>
  <desc id="desc">Public GitHub totals and repository languages, refreshed automatically.</desc>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: 'Courier New', Consolas, monospace; }
      .panel { fill:#17120f; stroke:#6f4e37; stroke-width:1; }
      .heading { fill:#f89820; font-size:23px; font-weight:700; }
      .label { fill:#f3e5c8; font-size:14px; }
      .value { fill:#7cb342; font-size:15px; font-weight:700; text-anchor:end; }
      .small { fill:#f3e5c8; font-size:13px; }
      .row { opacity:0; animation:enter .5s cubic-bezier(.22,.8,.3,1) forwards; animation-delay:calc(var(--i) * .11s); }
      .legend { opacity:0; animation:legendIn .45s ease-out forwards; animation-delay:calc(.2s + var(--i) * .1s); }
      .arc { animation:arcIn .9s cubic-bezier(.22,.8,.3,1) both,arcGlow 4s ease-in-out infinite; animation-delay:var(--delay),calc(1s + var(--i) * -.4s); }
      .sweep { transform-origin:694px 143px; animation:spin 7s linear infinite; }
      .count { transform-box:fill-box; transform-origin:center; animation:countIn .7s .55s cubic-bezier(.2,.9,.3,1.25) both; }
      .online { transform-box:fill-box; transform-origin:center; animation:blink 1.4s ease-in-out infinite; }
      .scan { animation:scan 4.8s linear infinite; }
      @keyframes enter { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:none; } }
      @keyframes legendIn { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
      @keyframes arcIn { from { opacity:0; stroke-dasharray:0 339.29; } }
      @keyframes arcGlow { 50% { opacity:.7; filter:url(#glow); } }
      @keyframes countIn { from { opacity:0; transform:scale(.55); } to { opacity:1; transform:scale(1); } }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes scan { from { transform:translateY(-18px); } to { transform:translateY(276px); } }
      @keyframes blink { 50% { opacity:.32; transform:scale(.72); } }
      @media (prefers-reduced-motion:reduce) { .row,.legend,.arc,.sweep,.count,.online,.scan { animation:none; opacity:1; transform:none; } }
    </style>
  </defs>
  <rect width="900" height="260" rx="12" fill="#0b0908"/>
  <rect class="panel" x="12" y="12" width="414" height="236" rx="9"/>
  <rect class="panel" x="438" y="12" width="450" height="236" rx="9"/>
  <text x="36" y="52" class="heading">JVM:// LIVE STATS</text>
  <circle class="online" cx="393" cy="43" r="5" fill="#7cb342" filter="url(#glow)"/>
  <g class="row" style="--i:0"><text x="56" y="83" class="label">STARS RECEIVED</text><text x="310" y="83" class="value">0</text></g><g class="row" style="--i:1"><text x="56" y="112" class="label">GITHUB COMMITS</text><text x="310" y="112" class="value">764</text></g><g class="row" style="--i:2"><text x="56" y="141" class="label">PUBLIC PRs</text><text x="310" y="141" class="value">15</text></g><g class="row" style="--i:3"><text x="56" y="170" class="label">PUBLIC ISSUES</text><text x="310" y="170" class="value">0</text></g><g class="row" style="--i:4"><text x="56" y="199" class="label">REPOS CONTRIBUTED</text><text x="310" y="199" class="value">50</text></g>
  <text x="468" y="52" class="heading">LANGUAGES:// REPOS</text>
  <g class="legend" style="--i:0"><rect x="492" y="73" width="14" height="14" rx="2" fill="#f89820"/><text x="517" y="85" class="label">TypeScript</text><text x="620" y="85" class="value small">17</text></g><g class="legend" style="--i:1"><rect x="492" y="100" width="14" height="14" rx="2" fill="#5382a1"/><text x="517" y="112" class="label">JavaScript</text><text x="620" y="112" class="value small">8</text></g><g class="legend" style="--i:2"><rect x="492" y="127" width="14" height="14" rx="2" fill="#c4a484"/><text x="517" y="139" class="label">No language</text><text x="620" y="139" class="value small">8</text></g><g class="legend" style="--i:3"><rect x="492" y="154" width="14" height="14" rx="2" fill="#7cb342"/><text x="517" y="166" class="label">HTML</text><text x="620" y="166" class="value small">3</text></g><g class="legend" style="--i:4"><rect x="492" y="181" width="14" height="14" rx="2" fill="#8d6e63"/><text x="517" y="193" class="label">Other / none</text><text x="620" y="193" class="value small">10</text></g>
  <circle cx="694" cy="143" r="54" fill="none" stroke="#3e2723" stroke-width="25"/>
  <circle class="arc" style="--i:0;--delay:0.00s" cx="694" cy="143" r="54" fill="none" stroke="#f89820" stroke-width="25" stroke-dasharray="125.39 213.90" stroke-dashoffset="-0.00" transform="rotate(-90 694 143)"/><circle class="arc" style="--i:1;--delay:0.12s" cx="694" cy="143" r="54" fill="none" stroke="#5382a1" stroke-width="25" stroke-dasharray="59.01 280.28" stroke-dashoffset="-125.39" transform="rotate(-90 694 143)"/><circle class="arc" style="--i:2;--delay:0.24s" cx="694" cy="143" r="54" fill="none" stroke="#c4a484" stroke-width="25" stroke-dasharray="59.01 280.28" stroke-dashoffset="-184.40" transform="rotate(-90 694 143)"/><circle class="arc" style="--i:3;--delay:0.36s" cx="694" cy="143" r="54" fill="none" stroke="#7cb342" stroke-width="25" stroke-dasharray="22.13 317.16" stroke-dashoffset="-243.41" transform="rotate(-90 694 143)"/><circle class="arc" style="--i:4;--delay:0.48s" cx="694" cy="143" r="54" fill="none" stroke="#8d6e63" stroke-width="25" stroke-dasharray="73.76 265.53" stroke-dashoffset="-265.53" transform="rotate(-90 694 143)"/>
  <circle class="sweep" cx="694" cy="143" r="72" fill="none" stroke="#f89820" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 22" opacity=".5"/>
  <circle cx="694" cy="143" r="35" fill="#17120f"/>
  <g class="count"><text x="694" y="139" text-anchor="middle" class="value" style="font-size:20px">46</text>
  <text x="694" y="157" text-anchor="middle" class="label" style="font-size:9px">OWN PUBLIC</text></g>
  <text x="854" y="229" text-anchor="end" class="label" style="font-size:10px;opacity:.65">HOURLY // GITHUB API</text>
  <rect class="scan" x="12" y="-18" width="876" height="18" fill="#f89820" opacity=".025"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Live GitHub telemetry for Suggus1899</title>
  <desc id="desc">Public GitHub totals and repository languages, refreshed automatically.</desc>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: 'Courier New', Consolas, monospace; }
      .panel { fill:#141321; stroke:#2b2740; stroke-width:1; }
      .heading { fill:#fe428e; font-size:23px; font-weight:700; }
      .label { fill:#a9fef7; font-size:14px; }
      .value { fill:#f8d847; font-size:15px; font-weight:700; text-anchor:end; }
      .small { fill:#a9fef7; font-size:13px; }
      .row { opacity:0; animation:enter .45s ease-out forwards; animation-delay:calc(var(--i) * .1s); }
      .arc { animation:pulse 3s ease-in-out infinite; animation-delay:calc(var(--i) * -.35s); }
      .online { animation:blink 1.4s ease-in-out infinite; }
      @keyframes enter { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:none; } }
      @keyframes pulse { 50% { opacity:.72; } }
      @keyframes blink { 50% { opacity:.35; } }
      @media (prefers-reduced-motion:reduce) { .row,.arc,.online { animation:none; opacity:1; } }
    </style>
  </defs>
  <rect width="900" height="260" rx="12" fill="#0d1117"/>
  <rect class="panel" x="12" y="12" width="414" height="236" rx="9"/>
  <rect class="panel" x="438" y="12" width="450" height="236" rx="9"/>
  <text x="36" y="52" class="heading">LIVE STATS</text>
  <circle class="online" cx="393" cy="43" r="5" fill="#3fb950" filter="url(#glow)"/>
  <g class="row" style="--i:0"><text x="56" y="83" class="label">TOTAL STARS</text><text x="310" y="83" class="value">0</text></g><g class="row" style="--i:1"><text x="56" y="112" class="label">CODE COMMITS</text><text x="310" y="112" class="value">764</text></g><g class="row" style="--i:2"><text x="56" y="141" class="label">PUBLIC PRs</text><text x="310" y="141" class="value">14</text></g><g class="row" style="--i:3"><text x="56" y="170" class="label">PUBLIC ISSUES</text><text x="310" y="170" class="value">0</text></g><g class="row" style="--i:4"><text x="56" y="199" class="label">CONTRIBUTED TO</text><text x="310" y="199" class="value">50</text></g>
  <text x="468" y="52" class="heading">LANGUAGES BY REPO</text>
  <rect x="492" y="73" width="14" height="14" rx="2" fill="#2f81f7"/><text x="517" y="85" class="label">TypeScript</text><text x="620" y="85" class="value small">17</text><rect x="492" y="100" width="14" height="14" rx="2" fill="#fe428e"/><text x="517" y="112" class="label">JavaScript</text><text x="620" y="112" class="value small">8</text><rect x="492" y="127" width="14" height="14" rx="2" fill="#f7812b"/><text x="517" y="139" class="label">HTML</text><text x="620" y="139" class="value small">3</text><rect x="492" y="154" width="14" height="14" rx="2" fill="#f8d847"/><text x="517" y="166" class="label">Go</text><text x="620" y="166" class="value small">3</text><rect x="492" y="181" width="14" height="14" rx="2" fill="#39c5cf"/><text x="517" y="193" class="label">EJS</text><text x="620" y="193" class="value small">2</text>
  <circle cx="694" cy="143" r="54" fill="none" stroke="#26223a" stroke-width="25"/>
  <circle class="arc" style="--i:0" cx="694" cy="143" r="54" fill="none" stroke="#2f81f7" stroke-width="25" stroke-dasharray="174.79 164.51" stroke-dashoffset="-0.00" transform="rotate(-90 694 143)"/><circle class="arc" style="--i:1" cx="694" cy="143" r="54" fill="none" stroke="#fe428e" stroke-width="25" stroke-dasharray="82.25 257.04" stroke-dashoffset="-174.79" transform="rotate(-90 694 143)"/><circle class="arc" style="--i:2" cx="694" cy="143" r="54" fill="none" stroke="#f7812b" stroke-width="25" stroke-dasharray="30.84 308.45" stroke-dashoffset="-257.04" transform="rotate(-90 694 143)"/><circle class="arc" style="--i:3" cx="694" cy="143" r="54" fill="none" stroke="#f8d847" stroke-width="25" stroke-dasharray="30.84 308.45" stroke-dashoffset="-287.88" transform="rotate(-90 694 143)"/><circle class="arc" style="--i:4" cx="694" cy="143" r="54" fill="none" stroke="#39c5cf" stroke-width="25" stroke-dasharray="20.56 318.73" stroke-dashoffset="-318.73" transform="rotate(-90 694 143)"/>
  <circle cx="694" cy="143" r="35" fill="#141321"/>
  <text x="694" y="139" text-anchor="middle" class="value" style="font-size:20px">46</text>
  <text x="694" y="157" text-anchor="middle" class="label" style="font-size:10px">PUBLIC REPOS</text>
  <text x="854" y="229" text-anchor="end" class="label" style="font-size:10px;opacity:.65">AUTO-REFRESH // GITHUB API</text>
</svg>